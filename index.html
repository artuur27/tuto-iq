*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:clamp(14px,3.6vw,17px)}
@media (min-width:700px){main{max-width:760px;margin:0 auto}header{max-width:760px;margin:0 auto;left:0;right:0}}
header{position:sticky;top:0;z-index:10;background:#0d1119;border-bottom:1px solid var(--line);padding:6px 8px}
header h1{font-size:15px}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:#232c40;color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:600}
nav button.on{background:var(--buy);color:#08121f;border-color:var(--buy)}
section{display:none;padding:8px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.card h2{font-size:17px;margin-bottom:4px}
ul.legs{list-style:none}
ul.legs li{padding:2.5px 0 2.5px 14px;position:relative;font-size:14px;line-height:1.35}
ul.legs li::before{content:"•";position:absolute;left:2px;color:var(--buy)}
.grid{display:grid;grid-template-columns:1fr;gap:6px}
.row{display:flex;gap:6px;align-items:flex-start}
.tag{flex:0 0 74px;text-align:center;font-size:10.5px;font-weight:800;text-transform:uppercase;border-radius:6px;padding:4px 0;margin-top:1px}
.t-buy{background:var(--buy);color:#08121f}.t-build{background:var(--build);color:#2a1800}
.t-sell{background:var(--sell);color:#2a0000}.t-rec{background:var(--rec);color:#00290a}
.t-prod{background:var(--prod);color:#22002e}.t-col{background:var(--col);color:#2a2000}
.acts{flex:1}.acts p{font-size:14.5px;line-height:1.35;padding:2px 0}
.planwrap{background:#0f1420;border:1px solid #3a4460;border-radius:10px;padding:10px;margin-top:8px;overflow:hidden}
.planbox{overflow:hidden;width:100%}
.plan2{position:relative;border-left:1px solid #2a3245;border-top:1px solid #2a3245;transform-origin:top left}
.plan2 .bld{position:absolute;border-radius:4px;border:1px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;padding:1px;font-weight:600;overflow:hidden}
.pl{font-size:11px;color:var(--dim);text-align:center;margin-top:6px;font-style:italic}
.prevnext{display:flex;gap:8px;margin-top:10px}
.prevnext button{flex:1;background:#232c40;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-weight:700}
.done{background:#12351a!important;border-color:#2c5e38!important}
</style></head><body>
